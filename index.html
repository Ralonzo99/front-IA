<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Analizador Automático de Facturas y Gastos - OCR Inteligente</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <meta name="description" content="Procesa automáticamente facturas y recibos con OCR inteligente. Análisis de gastos en tiempo real.">
  <meta name="keywords" content="OCR, facturas, gastos, análisis automático">
  <meta name="theme-color" content="#1d4ed8">
  
  <style>
    :root {
      --primary-color: #1d4ed8;
      --primary-light: #2563eb;
      --primary-dark: #1e40af;
      --secondary-color: #6b7280;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #dc2626;
      --bg-light: #f8f9fa;
      --bg-white: #ffffff;
      --border-color: #e5e7eb;
      --text-dark: #1f2937;
      --text-light: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-light);
      color: var(--text-dark);
    }

    app-root {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-light: #1a1a2e;
        --bg-white: #16213e;
        --text-dark: #ecf0f1;
        --text-light: #9ca3af;
        --border-color: #374151;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
